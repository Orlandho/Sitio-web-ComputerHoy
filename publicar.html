<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publicar Producto · ComputerHoy</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="http://localhost:3000/publicar.html" />
  
  <!-- Bootstrap 5.3.8 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <!-- Header -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a href="index.html" class="btn btn-outline-light">← Volver</a>
      </div>
    </nav>
  </header>

  <!-- Contenido -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h1 class="mb-4">Publicar nuevo producto</h1>
        
        <form id="formPublicar">
          <div class="mb-3">
            <label class="form-label">Nombre del producto</label>
            <input type="text" class="form-control" id="inputNombre" required>
          </div>
          
          <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" id="inputDescripcion" rows="3" required></textarea>
          </div>
          
          <div class="mb-3">
            <label class="form-label">Precio en el mercado</label>
            <input type="number" class="form-control" id="inputPrecio" step="0.01" required>
          </div>
          
          <div class="mb-3">
            <label class="form-label">Categoría</label>
            <select class="form-control" id="inputCategoria" required>
              <option value="">Seleccionar categoría</option>
              <option value="Refrigeración">Refrigeración</option>
              <option value="Limpieza">Limpieza</option>
              <option value="Video">Video</option>
              <option value="Audio">Audio</option>
              <option value="Cocina">Cocina</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Etiquetas (separadas por coma)</label>
            <input type="text" class="form-control" id="inputEtiquetas" placeholder="ej: smart, wifi, 4k">
          </div>
          
          <div class="mb-3">
            <label class="form-label">Imagen del producto (JPG)</label>
            <input type="file" class="form-control" id="inputImagen" accept=".jpg,.jpeg,.png" required>
            <small class="text-muted">Soporta JPG, JPEG, PNG. Máx 5MB</small>
            <div id="previewImagen" class="mt-3"></div>
          </div>

          <div class="mb-3">
            <label class="form-label">Badge (opcional)</label>
            <select class="form-control" id="inputBadge">
              <option value="">Sin badge</option>
              <option value="oferta">Oferta</option>
              <option value="nuevo">Nuevo</option>
              <option value="destacado">Destacado</option>
            </select>
          </div>
          
          <button type="submit" class="btn btn-primary w-100">Publicar</button>
          <div id="mensajeExito" class="alert alert-success mt-3 d-none"></div>
          <div id="mensajeError" class="alert alert-danger mt-3 d-none"></div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-top mt-5">
    <div class="container text-center small text-muted py-4">
      <p class="mb-0">© 2025 ComputerHoy · promoción de electrodomésticos</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="assets/js/publicar.js"></script>
</body>
</html>
