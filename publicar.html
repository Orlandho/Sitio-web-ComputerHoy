<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publicar Producto · ComputerHoy</title>
  
  <!-- Bootstrap 5.3.8 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <!-- Header -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a href="index.html" class="btn btn-outline-light">← Volver</a>
      </div>
    </nav>
  </header>

  <!-- Contenido -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h1 class="mb-4">Publicar nuevo producto</h1>
        
        <form id="formPublicar">
          <div class="mb-3">
            <label class="form-label">Nombre del producto</label>
            <input type="text" class="form-control" required>
          </div>
          
          <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" rows="3" required></textarea>
          </div>
          
          <div class="mb-3">
            <label class="form-label">Precio en el mercado</label>
            <input type="number" class="form-control" step="0.01" required>
          </div>
          
          <div class="mb-3">
            <label class="form-label">Categoría</label>
            <select class="form-control" required>
              <option value="">Seleccionar categoría</option>
              <option value="monitores">Monitores</option>
              <option value="teclados">Teclados</option>
              <option value="mouse">Mouse</option>
              <option value="otros">Otros</option>
            </select>
          </div>
          
          <div class="mb-3">
            <label class="form-label">URL de imagen</label>
            <input type="text" class="form-control" required>
          </div>
          
          <button type="submit" class="btn btn-primary w-100">Publicar</button>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-top mt-5">
    <div class="container text-center small text-muted py-4">
      <p class="mb-0">© 2025 ComputerHoy · promoción de electrodomésticos</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
