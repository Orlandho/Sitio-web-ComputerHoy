<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ComputerHoy · Promos de Electrodomésticos</title>
  <meta name="description" content="Blog promotor de electrodomésticos con ofertas, novedades y filtrado por categorías y etiquetas.">

  <!-- Bootstrap 5.3.8 CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
    crossorigin="anonymous">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <!-- Barra de navegación -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top">
    <div class="container">
      <div class="navbar-nav me-auto">
        <a class="nav-link active" href="#">Inicio</a>
        <a class="nav-link" href="#">Categoría</a>
      </div>

      <!-- Buscador centrado -->
      <form class="d-flex mx-auto w-50" role="search">
        <input class="form-control" type="search" placeholder="Buscar productos..." aria-label="Buscar">
      </form>

      <!-- Botón Login -->
      <button class="btn btn-primary">Login</button>
    </div>
  </nav>

  <!-- CONTENIDO -->
  <main class="container my-3">
    <div class="row g-3">
      <!-- Centro: Feed de productos -->
      <section class="col-12" id="col-feed">
        <div id="feed" class="d-flex flex-column gap-3">
          <!-- Tarjetas de productos desde JS -->
        </div>
        <div id="mensaje-vacio" class="text-center text-muted py-5 d-none">
          No se encontraron productos con los filtros actuales.
        </div>
      </section>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="border-top py-4">
    <div class="container text-center small text-muted">
      <p class="mb-0">© 2025 ComputerHoy · Proyecto académico (promoción de electrodomésticos)</p>
      <p class="mb-0">Hecho con Bootstrap 5</p>
    </div>
  </footer>

  <!-- Bootstrap 5.3.8 JS bundle (con Popper) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/Bpt"
    crossorigin="anonymous"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
