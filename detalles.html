<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detalles del Producto · ComputerHoy</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <!-- Header -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <div class="btn-group-left">
          <a href="index.html" class="btn btn-outline-light">← Volver</a>
        </div>
        <div class="search-container">
          <input class="form-control" type="search" placeholder="Buscar productos..." aria-label="Buscar">
        </div>
      </div>
    </nav>
  </header>

  <!-- Contenido -->
  <main class="container my-5">
    <div class="row">
      <div class="col-md-8">
        <!-- Detalles del producto -->
        <div id="detallesProducto"></div>

        <!-- Sección de comentarios -->
        <div class="mt-5">
          <h3>Comentarios</h3>
          
          <!-- Formulario para agregar comentario -->
          <div class="card mb-4">
            <div class="card-body">
              <form id="formComentario">
                <div class="mb-3">
                  <label class="form-label">Nombre</label>
                  <input type="text" id="inputAutor" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Comentario</label>
                  <textarea id="inputTexto" class="form-control" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Comentar</button>
              </form>
            </div>
          </div>

          <!-- Lista de comentarios -->
          <div id="listaComentarios"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal Editar Producto en Detalles -->
  <div class="modal fade" id="modalEditarDetalles" tabindex="-1" aria-labelledby="modalEditarDetallesLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalEditarDetallesLabel">Editar producto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="formEditarDetalles">
            <input type="hidden" id="edit-id-detalles">
            
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" id="edit-nombre-detalles" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Descripción</label>
              <textarea id="edit-descripcion-detalles" class="form-control" rows="3" required></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">Precio</label>
              <input type="number" id="edit-precio-detalles" class="form-control" step="0.01" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Categoría</label>
              <select id="edit-categoria-detalles" class="form-control" required>
                <option value="">Seleccionar categoría</option>
                <option value="Refrigeración">Refrigeración</option>
                <option value="Limpieza">Limpieza</option>
                <option value="Video">Video</option>
                <option value="Audio">Audio</option>
                <option value="Cocina">Cocina</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Etiquetas (separadas por coma)</label>
              <input type="text" id="edit-etiquetas-detalles" class="form-control" placeholder="ej: smart, wifi, 4k">
            </div>

            <div class="mb-3">
              <label class="form-label">Badge (opcional)</label>
              <select id="edit-badge-detalles" class="form-control">
                <option value="">Sin badge</option>
                <option value="oferta">Oferta</option>
                <option value="nuevo">Nuevo</option>
                <option value="destacado">Destacado</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Imagen del producto (JPG)</label>
              <input type="file" id="edit-imagen-file-detalles" class="form-control" accept=".jpg,.jpeg,.png">
              <small class="text-muted">Dejar en blanco para mantener la imagen actual</small>
              <div id="previewImagenEditarDetalles" class="mt-3"></div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" onclick="guardarProductoEditadoDetalles()">Guardar cambios</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-top mt-5">
    <div class="container text-center small text-muted py-4">
      <p class="mb-0">© 2025 ComputerHoy · promoción de electrodomésticos</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="assets/js/detalles.js"></script>
</body>
</html>
