<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detalles del Producto · ComputerHoy</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <!-- Header -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <div class="btn-group-left">
          <a href="index.html" class="btn btn-outline-light">← Volver</a>
        </div>
        <div class="search-container">
          <input class="form-control" type="search" placeholder="Buscar productos..." aria-label="Buscar">
        </div>
      </div>
    </nav>
  </header>

  <!-- Contenido -->
  <main class="container my-5">
    <div class="row">
      <div class="col-md-8">
        <!-- Detalles del producto -->
        <div id="detallesProducto"></div>

        <!-- Sección de comentarios -->
        <div class="mt-5">
          <h3>Comentarios</h3>
          
          <!-- Formulario para agregar comentario -->
          <div class="card mb-4">
            <div class="card-body">
              <form id="formComentario">
                <div class="mb-3">
                  <label class="form-label">Nombre</label>
                  <input type="text" id="inputAutor" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Comentario</label>
                  <textarea id="inputTexto" class="form-control" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Comentar</button>
              </form>
            </div>
          </div>

          <!-- Lista de comentarios -->
          <div id="listaComentarios"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-top mt-5">
    <div class="container text-center small text-muted py-4">
      <p class="mb-0">© 2025 ComputerHoy · promoción de electrodomésticos</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="assets/js/detalles.js"></script>
</body>
</html>
